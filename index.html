<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Abi-Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: eine Spalte wie in einer Lern-App. Violetter Kopfbereich mit Maskottchen Kobi, dicke 3D-Knöpfe, Themen als Kacheln mit Fortschrittsring, XP, Level und Abzeichen. */
:root{
  --bg:#f5f2ff; --dot:#ddd5fa; --paper:#ffffff; --ink:#1d1647; --muted:#625b8e; --line:#e1dbf8;
  --pri:#6b46f5; --pri-d:#4524bf; --pri-ink:#ffffff; --soft:#eee9ff;
  --math:#7a4dff; --phys:#0b84d4;
  --gold:#ffc42e; --gold-d:#d19200; --gold-ink:#3a2900;
  --ok:#1b9e63; --ok-d:#11744a; --ok-soft:#ddf5e9;
  --no:#e5484d; --no-d:#ae2c31; --no-soft:#fde8e8;
  --warn:#b86e00; --warn-soft:#fff0d1;
  --hero:#4a2bc4; --hero-2:#6b46f5; --hero-ink:#ffffff;
  --kobi:#ffd23f; --kobi-d:#ff9a1f; --eye:#1d1647;
  --f-d:'Fredoka',system-ui,sans-serif; --f-b:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150f30; --dot:#241c4d; --paper:#211a47; --ink:#f2eeff; --muted:#aca5d9; --line:#372e69;
  --pri:#a38bff; --pri-d:#6d4fe0; --pri-ink:#150f30; --soft:#2c2460;
  --math:#b19cff; --phys:#62c1ff;
  --ok:#4fd79c; --ok-d:#2a9d6d; --ok-soft:#133a2c;
  --no:#ff7f83; --no-d:#c24c51; --no-soft:#3d1c27;
  --warn:#f3bd55; --warn-soft:#3b2e10;
  --hero:#34229a; --hero-2:#4a2bc4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150f30; --dot:#241c4d; --paper:#211a47; --ink:#f2eeff; --muted:#aca5d9; --line:#372e69;
  --pri:#a38bff; --pri-d:#6d4fe0; --pri-ink:#150f30; --soft:#2c2460;
  --math:#b19cff; --phys:#62c1ff;
  --ok:#4fd79c; --ok-d:#2a9d6d; --ok-soft:#133a2c;
  --no:#ff7f83; --no-d:#c24c51; --no-soft:#3d1c27;
  --warn:#f3bd55; --warn-soft:#3b2e10;
  --hero:#34229a; --hero-2:#4a2bc4; color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:24px 24px;color:var(--ink);font:600 16px/1.5 var(--f-b);padding-inline:16px;padding-block:0 104px;min-height:100vh}
html.lock body{overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;min-width:0}
h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;font-weight:600}
h2{font-size:1.45rem;line-height:1.2}
h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
sup,sub{font-size:.7em;line-height:0}
.stack{display:flex;flex-direction:column;gap:16px}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:8px;font:700 1.35rem/1 var(--f-d);letter-spacing:.2px}
.chips{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 1rem/1 var(--f-d);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 11px 6px 8px;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.pill.fire svg{fill:#ff7a1a}.pill.bolt svg{fill:var(--gold)}

/* Karten */
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;min-width:0}
.eyebrow{font:700 .78rem/1 var(--f-d);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px;display:block}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:20px 18px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:end;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.hero h2{font-size:1.7rem}
.hero .hl{display:inline-block;background:var(--gold);color:var(--gold-ink);font:700 .8rem/1 var(--f-d);padding:5px 10px;border-radius:999px;margin-bottom:8px}
.hero .ttl{opacity:.9;margin:2px 0 12px}
.xpbar{height:14px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:999px;min-width:14px}
.hero small{display:block;margin-top:6px;opacity:.85;font-weight:700}
.hero-r{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:150px}
.bubble{position:relative;background:#fff;color:#1d1647;border-radius:16px;padding:9px 12px;font-size:.88rem;line-height:1.35;font-weight:700}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.hero-r svg{margin-top:4px}
.hero-l{grid-column:1;min-width:0}
@media (max-width:420px){.hero{grid-template-columns:1fr}.hero-r{flex-direction:row-reverse;max-width:none;align-items:center;margin-top:6px}.bubble:after{left:auto;right:-7px;bottom:auto;top:50%;transform:translateY(-50%) rotate(45deg)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:5px;font:600 .78rem var(--f-d);color:var(--muted)}
.week i{width:34px;height:34px;border-radius:50%;border:2.5px dashed var(--line);display:grid;place-items:center}
.week i svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.week .done i{background:var(--pri);border:2.5px solid var(--pri)}
.week .goal i{background:var(--gold);border-color:var(--gold)}.week .goal i svg{stroke:var(--gold-ink)}
.week .now{color:var(--ink)}.week .now i{border-style:solid;border-color:var(--pri)}
.bar{height:16px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:0;flex:1}
.bar i{display:block;height:100%;background:var(--pri);border-radius:999px;min-width:0}
.bar.g i{background:var(--gold)}

/* Knöpfe */

<script>
/* ===== Hilfsfunktionen ===== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rd=(x,d=0)=>{const f=Math.pow(10,d);return Math.round(x*f)/f;};
const fmt=(x,d=3)=>String(rd(x,d)).replace('.',',').replace('-','−');
const N=n=>String(n).replace('-','−');
const ab=Math.abs;
const sup=x=>`<sup>${x}</sup>`;
const sub=x=>`<sub>${x}</sub>`;
const DEG=Math.PI/180;
function poly(terms){let s='';terms.forEach(([c,e])=>{if(c===0)return;const a=ab(c);let body;if(e===0)body=String(a);else body=(a===1?'':String(a))+'x'+(e===1?'':sup(e));if(!s)s=(c<0?'−':'')+body;else s+=` ${c<0?'−':'+'} ${body}`;});return s||'0';}
function mcq(q,right,wrongs,ex){const opts=sh([right,...wrongs]);return {q,mc:opts,c:opts.indexOf(right),ex};}
function vec(a,b,c){return `<span class="vec"><i>${N(a)}</i><i>${N(b)}</i><i>${N(c)}</i></span>`;}
const GN=9.81;

/* ===== Generatoren: jede Funktion liefert eine neue Zufallsaufgabe ===== */
const GEN={};

/* ---------- MATHE ---------- */
GEN.m1=()=>{const t=R(0,3);
 if(t===0){let b,m,n,k,e;do{b=pick([2,3,5]);m=R(2,5);n=R(2,5);k=R(1,m+n-1);e=m+n-k;}while(Math.pow(b,e)>1000);
  return {q:`Berechne: ${b}${sup(m)} · ${b}${sup(n)} : ${b}${sup(k)}`,a:Math.pow(b,e),tol:0.001,ex:`Gleiche Basis: Beim Malnehmen Exponenten addieren (${m}+${n}=${m+n}), beim Teilen subtrahieren (${m+n}−${k}=${e}). Also ${b}${sup(e)} = ${Math.pow(b,e)}.`};}
 if(t===1){const b=pick([2,3,4,5,10]),n=R(1,3);const a=1/Math.pow(b,n);
  return {q:`Berechne ${b}${sup('−'+n)} (als Bruch oder Dezimalzahl).`,a,tol:a*0.02,ex:`Ein negativer Exponent bedeutet Kehrwert: ${b}${sup('−'+n)} = 1/${b}${sup(n)} = 1/${Math.pow(b,n)} ≈ ${fmt(a,4)}.`};}
 if(t===2){const x=pick([4,9,16,25]);const r=Math.sqrt(x);
  return {q:`Berechne ${x}${sup('3/2')}`,a:Math.pow(x,1.5),tol:0.001,ex:`x${sup('3/2')} = (√x)³. Hier √${x} = ${r}, und ${r}³ = ${Math.pow(r,3)}.`};}
 const [p,q]=pick([[2,8],[3,12],[5,20],[2,50],[8,18],[12,27],[18,32]]);
 return {q:`Berechne: √${p} · √${q}`,a:Math.sqrt(p*q),tol:0.001,ex:`√a · √b = √(a·b). Also √${p*q} = ${Math.sqrt(p*q)}.`};};

GEN.m2=()=>{const t=R(0,3);const b=pick([2,3,4,5,10]);let k=R(1,4);while(Math.pow(b,k)>10000)k--;const B=Math.pow(b,k);
 const L=(arg)=>b===10?`lg(${arg})`:`log${sub(b)}(${arg})`;
 if(t===0)return {q:`Berechne ${L(B)}`,a:k,tol:0.001,ex:`${L(B)} fragt: „${b} hoch wie viel ergibt ${B}?“ Antwort: ${b}${sup(k)} = ${B}, also ${k}.`};
 if(t===1)return {q:`Berechne ${L('1/'+B)}`,a:-k,tol:0.001,ex:`1/${B} = ${b}${sup('−'+k)}. Also ist der Logarithmus −${k}.`};
 if(t===2)return {q:`Löse nach x: ${b}${sup('x')} = ${B}`,a:k,tol:0.001,ex:`x = ${L(B)}. Es gilt ${b}${sup(k)} = ${B}, also x = ${k}.`};
 const i=R(1,3),j=R(1,3);
 return {q:`Berechne ${L(Math.pow(b,i))} + ${L(Math.pow(b,j))}`,a:i+j,tol:0.001,ex:`Einzeln: ${i} und ${j}. Oder mit dem Gesetz log(x)+log(y) = log(x·y): ${L(Math.pow(b,i+j))} = ${i+j}.`};};

GEN.m3=()=>{const t=R(0,2);
 if(t===0){const x1=R(-4,2),dx=R(1,4),m=pick([-4,-3,-2,-1,1,2,3,4]),y1=R(-5,5);const x2=x1+dx,y2=y1+m*dx;
  return {q:`Bestimme die Steigung m der Geraden durch P(${N(x1)}|${N(y1)}) und Q(${N(x2)}|${N(y2)}).`,a:m,tol:0.001,ex:`m = (y₂−y₁)/(x₂−x₁) = (${N(y2)}−(${N(y1)}))/(${N(x2)}−(${N(x1)})) = ${N(m*dx)}/${dx} = ${N(m)}.`};}
 if(t===1){const m=pick([-4,-3,-2,2,3,4,5]),x0=R(-3,4),y0=R(-6,8);const n=y0-m*x0;
  return {q:`Die Gerade f(x) = ${N(m)}x + n geht durch P(${N(x0)}|${N(y0)}). Bestimme n.`,a:n,tol:0.001,ex:`Punktprobe: ${N(y0)} = ${N(m)}·(${N(x0)}) + n, also n = ${N(y0)} − (${N(m*x0)}) = ${N(n)}.`};}
 const x=R(-5,6),y=R(-5,6),A=2*x+y,B=x-y;const askX=Math.random()<0.5;
 return {q:`Löse das Gleichungssystem und gib ${askX?'x':'y'} an:<br>I: 2x + y = ${N(A)}<br>II: x − y = ${N(B)}`,a:askX?x:y,tol:0.001,meta:{A,B,x,y},ex:`Addition I + II: 3x = ${N(A+B)}, also x = ${N(x)}. Einsetzen in II: y = x − ${N(B)} = ${N(y)}.`};};

GEN.m4=()=>{const t=R(0,3);

 if(t===1){const C=pick([2,4,10,22,47]),U=pick([5,9,12,24]);
  return {q:`Ein Kondensator mit C = ${C} µF wird auf ${U} V aufgeladen. Welche Ladung trägt er?`,a:C*U,tol:0.05,unit:'µC',ex:`Q = C·U = ${C} µF · ${U} V = ${C*U} µC.`};}
 if(t===2){const C=pick([2,4,10,22,47]),U=pick([5,9,12,24]);const Q=C*U;
  return {q:`Ein Kondensator trägt bei ${U} V die Ladung ${Q} µC. Wie groß ist seine Kapazität?`,a:C,tol:0.05,unit:'µF',ex:`C = Q/U = ${Q} µC / ${U} V = ${C} µF.`};}
 const q=pick([1,2,5]),E=pick([2,10,50]);
 return {q:`Eine Ladung von ${q} µC befindet sich in einem homogenen Feld der Stärke ${E} kV/m. Welche Kraft wirkt auf sie?`,a:q*E,tol:0.02,unit:'mN',ex:`F = q·E = ${q}·10⁻⁶ C · ${E}·10³ V/m = ${fmt(q*E/1000,4)} N = ${q*E} mN.`};};

const TOPICS=[
{id:'m1',s:'M',n:'Potenzen & Wurzeln',d:'Potenzgesetze, negative und gebrochene Exponenten, Wurzelgesetze.',vq:'Potenzgesetze Wurzelgesetze',cards:[
 ['Wie lauten die drei Potenzgesetze für gleiche Basis?','aᵐ · aⁿ = a<sup>m+n</sup><br>aᵐ : aⁿ = a<sup>m−n</sup><br>(aᵐ)ⁿ = a<sup>m·n</sup>','Beim Malnehmen werden die Exponenten addiert, nicht multipliziert.'],
 ['Was bedeuten a<sup>−n</sup> und a<sup>1/n</sup>?','a<sup>−n</sup> = 1/aⁿ (Kehrwert)<br>a<sup>1/n</sup> = ⁿ√a<br>a<sup>m/n</sup> = ⁿ√(aᵐ)','Ein negativer Exponent macht die Zahl nicht negativ.'],
 ['Welche Wurzelgesetze gibt es, und was gilt nicht?','√a · √b = √(a·b), √(a/b) = √a/√b<br>Aber: √(a+b) ≠ √a + √b','√(9+16) = 5, aber √9 + √16 = 7.']]},
{id:'m2',s:'M',n:'Logarithmus',d:'Definition, Logarithmengesetze, Exponentialgleichungen lösen.',vq:'Logarithmus Logarithmengesetze',cards:[
 ['Was bedeutet log<sub>b</sub>(x) = y?','b<sup>y</sup> = x. Der Logarithmus ist der Exponent, mit dem man b potenzieren muss, um x zu erhalten (b > 0, b ≠ 1, x > 0).','lg = Basis 10, ln = Basis e.'],
 ['Wie lauten die Logarithmengesetze?','log(x·y) = log x + log y<br>log(x/y) = log x − log y<br>log(x<sup>k</sup>) = k · log x'],
 ['Wie löst man b<sup>x</sup> = N?','x = log N / log b (mit lg oder ln im Taschenrechner).','Beispiel: 2<sup>x</sup> = 20 → x = lg 20 / lg 2 ≈ 4,32.']]},
{id:'m3',s:'M',n:'Lineare Funktionen & Gleichungssysteme',d:'Steigung, Geradengleichung, Punktprobe, Lösungsverfahren für LGS.',vq:'Lineare Funktionen Geradengleichung lineares Gleichungssystem',cards:[
 ['Wie berechnet man die Steigung durch zwei Punkte?','m = (y₂ − y₁)/(x₂ − x₁). In f(x) = mx + n ist n der y-Achsenabschnitt.','Reihenfolge in Zähler und Nenner gleich halten.'],
 ['Wie bestimmt man n, wenn m und ein Punkt bekannt sind?','Punkt in y = mx + n einsetzen und nach n auflösen: n = y₀ − m·x₀.'],
 ['Welche Verfahren gibt es für lineare Gleichungssysteme?','Einsetzen, Gleichsetzen, Addition. Die Lösung ist der Schnittpunkt der Geraden. Parallele Geraden: keine Lösung, identische Geraden: unendlich viele.']]},
{id:'m4',s:'M',n:'Quadratische Gleichungen',d:'pq-Formel, Diskriminante, Vieta, Ausklammern.',vq:'quadratische Gleichungen pq-Formel',cards:[
 ['Wie lautet die pq-Formel?','Für x² + px + q = 0 gilt: x = −p/2 ± √((p/2)² − q).','Vorher durch den Faktor vor x² teilen, damit x² allein steht.'],
 ['Was sagt die Diskriminante D = (p/2)² − q?','D > 0: zwei Lösungen, D = 0: eine Lösung, D < 0: keine reelle Lösung.'],
 ['Was besagt der Satz von Vieta und wann klammert man aus?','x₁ + x₂ = −p und x₁ · x₂ = q.<br>Fehlt das konstante Glied (x² + kx = 0): x(x + k) = 0 → x = 0 oder x = −k.']]},
{id:'m5',s:'M',n:'Quadratische Funktionen',d:'Scheitelform, quadratische Ergänzung, Parabel zeichnen und beschreiben.',vq:'quadratische Funktionen Scheitelform Parabel',cards:[
 ['Wie liest man den Scheitelpunkt aus f(x) = a(x − d)² + e ab?','S(d | e). Das Vorzeichen in der Klammer wird gedreht: (x + 3)² bedeutet d = −3.'],
 ['Wie funktioniert die quadratische Ergänzung?','x² + bx + c = (x + b/2)² + c − (b/2)². Der Scheitel ist S(−b/2 | c − b²/4).'],
 ['Wie beeinflusst a die Parabel?','a > 0: nach oben geöffnet, a < 0: nach unten. |a| > 1: gestreckt (schmaler), |a| < 1: gestaucht (breiter).']]},
{id:'m6',s:'M',n:'Exponentialfunktionen & Wachstum',d:'Wachstumsfaktor, Zinseszins, Verdopplungszeit, exponentiell vs. linear.',vq:'Exponentialfunktion exponentielles Wachstum Zinseszins',cards:[
 ['Was bedeuten a und b in f(x) = a · b<sup>x</sup>?','a ist der Startwert f(0), b der Wachstumsfaktor. b > 1: Wachstum, 0 < b < 1: Abnahme.'],
 ['Wie rechnet man mit Prozent und Zinseszins?','Zunahme um p %: Faktor 1 + p/100. Abnahme: 1 − p/100.<br>K<sub>n</sub> = K₀ · (1 + p/100)<sup>n</sup>','Faktor pro Schritt, dann n-mal anwenden. Nicht p mal n rechnen.'],
 ['Wie unterscheiden sich lineares und exponentielles Wachstum?','Linear: pro Schritt kommt immer derselbe Betrag dazu (+ c). Exponentiell: pro Schritt wird mit demselben Faktor multipliziert (· b).']]},
{id:'m7',s:'M',n:'Trigonometrie im rechtwinkligen Dreieck',d:'Sinus, Kosinus, Tangens, Winkel und Seiten berechnen.',vq:'Sinus Kosinus Tangens rechtwinkliges Dreieck',cards:[
 ['Wie sind sin, cos und tan definiert?','sin α = Gegenkathete/Hypotenuse<br>cos α = Ankathete/Hypotenuse<br>tan α = Gegenkathete/Ankathete'],
 ['Wie berechnet man einen Winkel aus Seiten?','Mit der Umkehrfunktion: α = sin⁻¹(…), cos⁻¹(…) oder tan⁻¹(…).','Taschenrechner auf DEG (Grad), nicht RAD!'],
 ['Wie hängen Steigung und Winkel zusammen?','Steigung m = tan α. Beispiel: 100 % Steigung entspricht 45°.']]},
{id:'m8',s:'M',n:'Sinus- und Kosinussatz',d:'Beliebige Dreiecke berechnen: SWS, SSS, WSW, SsW.',vq:'Sinussatz Kosinussatz',cards:[
 ['Wie lautet der Sinussatz und wann nutzt man ihn?','a/sin α = b/sin β = c/sin γ. Wenn ein Seiten-Winkel-Paar bekannt ist (WSW, SWW, SsW).'],
 ['Wie lautet der Kosinussatz und wann nutzt man ihn?','c² = a² + b² − 2ab·cos γ. Bei SWS (zwei Seiten und der eingeschlossene Winkel) und SSS.','Für γ = 90° wird daraus der Satz des Pythagoras.'],
 ['Was gilt immer in einem Dreieck?','Winkelsumme 180°. Fläche A = ½ · a · b · sin γ.']]},
{id:'m9',s:'M',n:'Bogenmaß & trigonometrische Funktionen',d:'Gradmaß ↔ Bogenmaß, Sinuskurve, Amplitude, Periode, Spezialwerte.',vq:'Bogenmaß Sinusfunktion Amplitude Periode',cards:[
 ['Wie rechnet man Grad in Bogenmaß um?','x = α · π/180°. 180° = π, 90° = π/2, 360° = 2π.'],
 ['Was bedeuten die Parameter in f(x) = a·sin(b(x − c)) + d?','Amplitude |a|, Periode 2π/b, Verschiebung c nach rechts, Mittellinie y = d.'],
 ['Welche Spezialwerte muss man kennen?','sin: 0° → 0, 30° → ½, 45° → √2/2, 60° → √3/2, 90° → 1. Beim cos genau umgekehrt (cos 0° = 1, cos 60° = ½, cos 90° = 0).']]},
{id:'m10',s:'M',n:'Ableitung',d:'Steigung der Tangente, Ableitungsregeln, Tangentengleichung.',vq:'Ableitung Ableitungsregeln Potenzregel',cards:[
 ['Was bedeutet die Ableitung f′(x₀)?','Die Steigung der Tangente im Punkt x₀, also die momentane Änderungsrate. f′(x₀) = lim<sub>h→0</sub> (f(x₀+h) − f(x₀))/h.'],
 ['Welche Ableitungsregeln braucht man zuerst?','Potenzregel: (xⁿ)′ = n·xⁿ⁻¹. Faktorregel: (c·f)′ = c·f′. Summenregel: (f+g)′ = f′+g′. Konstanten fallen weg.'],
 ['Wie lautet die Tangente an der Stelle x₀?','y = f′(x₀)·(x − x₀) + f(x₀)','Zuerst f(x₀) und f′(x₀) getrennt ausrechnen.']]},
{id:'m11',s:'M',n:'Extremstellen & Wendepunkte',d:'Kurvendiskussion: Ableitungen, Nullsetzen, Art bestimmen.',vq:'Extremstellen Wendepunkte Kurvendiskussion',cards:[
 ['Wie findet man Extremstellen?','f′(x) = 0 lösen. Dann f″ prüfen: f″ > 0 Tiefpunkt, f″ < 0 Hochpunkt.'],
 ['Wie findet man Wendepunkte?','f″(x) = 0 und f‴(x) ≠ 0. Am Wendepunkt ist die Steigung extremal (stärkster Anstieg oder Abfall).'],
 ['Welcher typische Fehler passiert beim y-Wert?','Den y-Wert immer in f einsetzen, nicht in f′ oder f″.']]},
{id:'m12',s:'M',n:'Wahrscheinlichkeit',d:'Laplace, Pfadregeln, mit/ohne Zurücklegen, bedingte Wahrscheinlichkeit.',vq:'Wahrscheinlichkeit Pfadregeln Baumdiagramm',cards:[
 ['Was ist die Laplace-Wahrscheinlichkeit und das Gegenereignis?','P(A) = günstige/mögliche Ergebnisse. P(nicht A) = 1 − P(A).'],
 ['Wie lauten die Pfadregeln?','Produktregel: Wahrscheinlichkeiten entlang eines Pfads multiplizieren. Summenregel: Wahrscheinlichkeiten mehrerer Pfade addieren.','Ohne Zurücklegen ändern sich Zähler und Nenner im zweiten Zug.'],
 ['Was ist bedingte Wahrscheinlichkeit und Unabhängigkeit?','P<sub>A</sub>(B) = P(A∩B)/P(A). A und B sind unabhängig, wenn P(A∩B) = P(A)·P(B).']]},
{id:'m13',s:'M',n:'Kombinatorik',d:'Fakultät, Anordnungen, Auswahlen, Binomialkoeffizient.',vq:'Kombinatorik Binomialkoeffizient Fakultät',cards:[
 ['Wie viele Anordnungen gibt es für n Objekte?','n! = n · (n−1) · … · 1'],
 ['Was ist der Binomialkoeffizient?','C(n,k) = n!/(k!·(n−k)!): Auswahlen von k aus n, Reihenfolge egal (z. B. Lotto).'],
 ['Welche vier Fälle gibt es beim Ziehen?','Reihenfolge wichtig + Wiederholung: n<sup>k</sup>. Reihenfolge wichtig, ohne Wiederholung: n·(n−1)·…. Reihenfolge egal, ohne Wiederholung: C(n,k).','Erst fragen: Spielt die Reihenfolge eine Rolle? Dann: Darf wiederholt werden?']]},
{id:'m14',s:'M',n:'Vektoren',d:'Vektor zwischen Punkten, Betrag, Skalarprodukt, Orthogonalität, Geraden.',vq:'Vektoren Skalarprodukt Betrag Orthogonalität',cards:[
 ['Wie berechnet man den Vektor AB und seine Länge?','AB = B − A (Spitze minus Fuß). |v| = √(x² + y² + z²).'],
 ['Was ist das Skalarprodukt und was sagt es aus?','a·b = a₁b₁ + a₂b₂ + a₃b₃. Gleich 0 ⇔ a und b orthogonal. Winkel: cos φ = a·b/(|a|·|b|).'],
 ['Wie lautet eine Geradengleichung im Raum?','g: x = A + t·v (Stützvektor + Parameter · Richtungsvektor). Parallel, wenn die Richtungsvektoren Vielfache sind.']]},
{id:'m15',s:'M',n:'Körper & Volumen',d:'Volumen und Oberfläche von Zylinder, Kegel, Kugel, Pyramide.',vq:'Volumen Oberfläche Zylinder Kegel Kugel',cards:[
 ['Wie lauten Volumen und Oberfläche beim Zylinder?','V = π·r²·h, Mantel = 2π·r·h, O = 2π·r·(r + h).'],
 ['Wie lauten die Formeln für Kegel und Kugel?','Kegel: V = ⅓·π·r²·h. Kugel: V = 4/3·π·r³, O = 4π·r².'],
 ['Wie rechnet man Einheiten um?','1 m = 10 dm = 100 cm. Beim Volumen mit 10³ = 1000 pro Stufe. 1 l = 1 dm³.','Länge in cm → Volumen in cm³, Fläche in cm².']]},

{id:'p1',s:'P',n:'Geschwindigkeit & gleichförmige Bewegung',d:'v = s/t, Einheiten, Weg-Zeit-Diagramme.',vq:'gleichförmige Bewegung Geschwindigkeit s t Diagramm',cards:[
 ['Wie lautet die Grundformel der Geschwindigkeit?','v = s/t, also s = v·t und t = s/v.'],
 ['Wie rechnet man km/h und m/s um?','1 m/s = 3,6 km/h. Von km/h nach m/s: durch 3,6. Von m/s nach km/h: mal 3,6.'],
 ['Was zeigt ein Weg-Zeit-Diagramm?','Bei gleichförmiger Bewegung ist es eine Gerade; ihre Steigung ist die Geschwindigkeit. Schnittpunkt zweier Geraden = Begegnung.']]},
{id:'p2',s:'P',n:'Beschleunigte Bewegung',d:'Beschleunigung, s = ½at², Bremsweg, freier Fall.',vq:'beschleunigte Bewegung freier Fall Beschleunigung',cards:[
 ['Welche Formeln gelten bei Start aus der Ruhe?','a = Δv/Δt, v = a·t, s = ½·a·t², v² = 2·a·s.'],
 ['Wie groß ist die Fallbeschleunigung?','g = 9,81 m/s² (oft 10 m/s² gerundet), unabhängig von der Masse (ohne Luftwiderstand).'],
 ['Was gilt für den Anhalteweg?','Anhalteweg = Reaktionsweg + Bremsweg. Der Bremsweg wächst quadratisch mit v: doppelte Geschwindigkeit → vierfacher Bremsweg.']]},
{id:'p3',s:'P',n:'Kräfte & Newtonsche Gesetze',d:'Trägheit, F = m·a, Gewichtskraft, Hooke, Reibung.',vq:'Newtonsche Gesetze Kraft Gewichtskraft',cards:[
 ['Wie lauten die drei Newtonschen Gesetze?','1. Trägheit: ohne resultierende Kraft bleibt die Bewegung gleich.<br>2. F = m·a.<br>3. Actio = Reactio: Kräfte wirken auf verschiedene Körper.'],
 ['Was ist der Unterschied zwischen Masse und Gewichtskraft?','Masse m in kg ist ortsunabhängig. Gewichtskraft F_G = m·g in N hängt vom Ort ab (g = 9,81 N/kg auf der Erde).'],
 ['Wie lauten Hooke und Reibung?','Hooke: F = D·s (D in N/m). Reibung: F_R = μ·F_N. Die resultierende Kraft ist die Vektorsumme aller Kräfte.']]},
{id:'p4',s:'P',n:'Arbeit, Energie & Leistung',d:'W = F·s, Energieformen, Wirkungsgrad, Leistung.',vq:'Arbeit Energie Leistung Physik',cards:[
 ['Wie lauten Arbeit und Leistung?','W = F·s (Kraft in Wegrichtung), Einheit J = N·m. P = W/t, Einheit W = J/s.'],
 ['Welche Energieformen sollte man kennen?','E_pot = m·g·h, E_kin = ½·m·v², E_Spann = ½·D·s².'],
 ['Was ist der Wirkungsgrad?','η = E_nutz/E_zu, immer kleiner als 1. Der Rest wird als Wärme „entwertet“, die Energie geht nicht verloren.']]},
{id:'p5',s:'P',n:'Energieerhaltung',d:'Energieumwandlung ohne und mit Reibung, v = √(2gh).',vq:'Energieerhaltungssatz Mechanik',cards:[
 ['Was besagt der Energieerhaltungssatz in der Mechanik?','Ohne Reibung bleibt E_pot + E_kin + E_Spann konstant. Energie wird nur umgewandelt.'],
 ['Wie kommt man auf v = √(2gh)?','m·g·h = ½·m·v². Die Masse kürzt sich: v = √(2·g·h).','Die Fallgeschwindigkeit hängt nicht von der Masse ab.'],
 ['Was ändert sich mit Reibung?','E_vorher = E_nachher + W_Reibung. Ein Teil der mechanischen Energie wird in Wärme umgewandelt.']]},
{id:'p6',s:'P',n:'Elektrischer Stromkreis',d:'Ohmsches Gesetz, Reihen- und Parallelschaltung, elektrische Leistung.',vq:'Ohmsches Gesetz Reihenschaltung Parallelschaltung',cards:[
 ['Wie lautet das Ohmsche Gesetz?','U = R·I (bei konstantem R). Einheiten: V, Ω, A.'],
 ['Wie unterscheiden sich Reihen- und Parallelschaltung?','Reihe: R = R₁ + R₂, I überall gleich, Spannungen teilen sich.<br>Parallel: 1/R = 1/R₁ + 1/R₂, U gleich, Ströme teilen sich.'],
 ['Wie berechnet man Leistung und Energie?','P = U·I. Energie E = P·t. 1 kWh = 3,6 MJ.']]},
{id:'p7',s:'P',n:'Kreisbewegung',d:'Frequenz, Periode, Bahngeschwindigkeit, Zentripetalkraft.',vq:'Kreisbewegung Zentripetalkraft Winkelgeschwindigkeit',cards:[
 ['Wie hängen T, f und v zusammen?','f = 1/T. Bahngeschwindigkeit v = 2π·r/T = ω·r mit ω = 2π/T.'],
 ['Wie groß sind Zentripetalbeschleunigung und -kraft?','a_z = v²/r = ω²·r. F_Z = m·v²/r, zum Kreismittelpunkt gerichtet.'],
 ['Was ist die Zentrifugalkraft?','Eine Scheinkraft im rotierenden Bezugssystem. Im ruhenden System fliegt der Körper ohne Zentripetalkraft tangential geradeaus weiter.']]},
{id:'p8',s:'P',n:'Wärmelehre',d:'Q = c·m·ΔT, Mischung, Aggregatzustände.',vq:'Wärmelehre spezifische Wärmekapazität Mischungstemperatur',cards:[
 ['Wie berechnet man die zugeführte Wärme?','Q = c·m·ΔT. Für Wasser c = 4,19 kJ/(kg·K) = 4190 J/(kg·K).'],
 ['Wie berechnet man eine Mischungstemperatur?','Abgegebene Wärme = aufgenommene Wärme: m₁c₁(T₁ − T_m) = m₂c₂(T_m − T₂). Gleiche Massen und gleiches Material: Mittelwert.'],
 ['Was passiert bei Aggregatzustandsänderungen?','Während Schmelzen oder Verdampfen bleibt die Temperatur konstant. Die Energie geht in Schmelzwärme Q = q·m bzw. Verdampfungswärme.']]},
{id:'p9',s:'P',n:'Schwingungen & Wellen',d:'Periode, Frequenz, Pendel, Wellengeschwindigkeit, Schall.',vq:'Schwingungen Wellen Fadenpendel Federpendel',cards:[
 ['Welche Größen beschreiben eine Schwingung oder Welle?','Amplitude, Periodendauer T, Frequenz f = 1/T, Wellenlänge λ. Ausbreitung: c = λ·f.'],
 ['Wie lauten die Periodendauern der Pendel?','Fadenpendel: T = 2π·√(l/g) (unabhängig von der Masse). Federpendel: T = 2π·√(m/D).'],
 ['Wie schnell sind Schall und Licht?','Schall in Luft ≈ 340 m/s (Longitudinalwelle). Licht 3·10⁸ m/s (Transversalwelle). Gewitter: 3 s Verzug ≈ 1 km Entfernung.']]},
{id:'p10',s:'P',n:'Radioaktivität',d:'α-, β-, γ-Strahlung, Halbwertszeit, Zerfallsgesetz.',vq:'Radioaktivität Halbwertszeit Zerfallsgesetz',cards:[
 ['Welche drei Strahlungsarten unterscheidet man?','α: Helium-Kerne, Papier schirmt ab. β: Elektronen, wenige mm Aluminium. γ: energiereiche elektromagnetische Strahlung, dickes Blei oder Beton.'],
 ['Was ist die Halbwertszeit und wie lautet das Zerfallsgesetz?','Zeit, in der die Hälfte der Kerne zerfällt. N(t) = N₀ · (1/2)<sup>t/T½</sup>.'],
 ['Was misst die Aktivität und wie schützt man sich?','Aktivität A in Bq = Zerfälle pro Sekunde. Schutz durch Abstand, Abschirmung, kurze Zeit.']]},
{id:'p11',s:'P',n:'Optik: Linsen & Brechung',d:'Brechungsgesetz, Linsengleichung, Abbildungsmaßstab.',vq:'Optik Linsengleichung Brechungsgesetz',cards:[
 ['Wie lautet das Brechungsgesetz?','sin α₁ / sin α₂ = n₂/n₁. Beim Übergang in ein dichteres Medium wird der Strahl zum Lot hin gebrochen. Ab dem Grenzwinkel gibt es Totalreflexion.'],
 ['Wie lauten Linsengleichung und Abbildungsmaßstab?','1/f = 1/g + 1/b. B/G = b/g.','g Gegenstandsweite, b Bildweite, f Brennweite.'],
 ['Welche drei Strahlen konstruiert man bei der Sammellinse?','Parallelstrahl → geht durch den Brennpunkt. Mittelpunktstrahl → geht ungebrochen durch. Brennpunktstrahl → verlässt die Linse parallel.']]},
{id:'p12',s:'P',n:'Impuls & Stöße',d:'p = m·v, Impulserhaltung, elastischer und unelastischer Stoß.',vq:'Impuls Impulserhaltung Stoß',cards:[
 ['Was ist der Impuls?','p = m·v, ein Vektor mit Einheit kg·m/s. Kraft als Impulsänderung: F = Δp/Δt.'],
 ['Was sagt die Impulserhaltung?','In einem abgeschlossenen System ist der Gesamtimpuls konstant: Σp vorher = Σp nachher. Gilt für Stöße und Rückstoß.'],
 ['Wie unterscheiden sich elastischer und unelastischer Stoß?','Elastisch: Impuls und kinetische Energie bleiben erhalten. Unelastisch: nur der Impuls bleibt erhalten, ein Teil der kinetischen Energie wird zu Wärme.']]},
{id:'p13',s:'P',n:'Elektrisches Feld & Kondensator',d:'Feldstärke, Plattenkondensator, Kapazität, Kraft auf Ladungen.',vq:'elektrisches Feld Plattenkondensator Kapazität',cards:[
 ['Wie ist die elektrische Feldstärke definiert?','E = F/q, Einheit V/m = N/C. Im Plattenkondensator ist das Feld homogen: E = U/d.'],
 ['Was ist die Kapazität eines Kondensators?','C = Q/U, Einheit Farad (F). Gespeicherte Energie: E = ½·C·U².'],
 ['Wie wirkt das Feld auf Ladungen?','F = q·E. Feldlinien verlaufen von + nach −, dichtere Linien bedeuten stärkeres Feld.']]}
];

function pickTopics(pool,n,maxDup){const cnt={},out=[];
  for(let i=0;i<n;i++){const cand=pool.filter(t=>(cnt[t.id]||0)<maxDup);if(!cand.length)break;
    let r=Math.random()*cand.reduce((a,t)=>a+weight(t),0),ch=cand[cand.length-1];
    for(const t of cand){r-=weight(t);if(r<=0){ch=t;break;}}
    out.push(ch);cnt[ch.id]=(cnt[ch.id]||0)+1;}
  return out;}

function parseNums(raw){let s=String(raw).trim().replace(/\s+/g,'').replace(/[−–]/g,'-');const out=[];if(!s)return out;
  const conv=x=>{const m=x.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m){const d=parseFloat(m[2]);return d===0?null:parseFloat(m[1])/d;}
    return /^-?\d*\.?\d+(e-?\d+)?$/i.test(x)?parseFloat(x):null;};
  const a=conv(s.replace(',','.'));if(a!=null)out.push(a);
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)){const b=conv(s.replace(/\./g,'').replace(',','.'));if(b!=null)out.push(b);}
  return out;}

/* ----- Zugangssperre (Passwort wird nur als Hash gespeichert) ----- */
const SHA={K:null,H:null};
function sha256(m){
  if(!SHA.K){const pr=[];for(let n=2;pr.length<64;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break;}if(p)pr.push(n);}
    SHA.K=pr.map(p=>Math.floor((Math.cbrt(p)%1)*4294967296));SHA.H=pr.slice(0,8).map(p=>Math.floor((Math.sqrt(p)%1)*4294967296));}
  const K=SHA.K,h=SHA.H.slice(),l=m.length,nb=((l+9+63)>>6)<<6,b=new Uint8Array(nb);b.set(m);b[l]=0x80;
  const dv=new DataView(b.buffer);dv.setUint32(nb-8,Math.floor(l*8/4294967296));dv.setUint32(nb-4,(l*8)>>>0);const w=new Uint32Array(64);
  for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+w[i-7]+(((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10)))>>>0;}
    let a=h[0],bb=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(let i=0;i<64;i++){const t1=(hh+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+w[i])>>>0;
      const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&bb)^(a&c)^(bb&c)))>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;}
    h[0]=(h[0]+a)>>>0;h[1]=(h[1]+bb)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0;}
  const out=new Uint8Array(32),ov=new DataView(out.buffer);h.forEach((x,i)=>ov.setUint32(i*4,x));return out;}
const U8=s=>new TextEncoder().encode(s);
function hashPw(pw){const salt=U8(AUTH.salt);let h=sha256(U8(AUTH.salt+'|'+String(pw).trim().toLowerCase()));
  for(let i=1;i<AUTH.rounds;i++){const x=new Uint8Array(32+salt.length);x.set(h);x.set(salt,32);h=sha256(x);}
  return Array.from(h).map(x=>x.toString(16).padStart(2,'0')).join('');}

const safeHtml=t=>esc(t==null?'':t).replace(/&lt;(\/?)(sup|sub|b|i|br)&gt;/g,'<$1$2>');
const CORE_IDS=new Set(TOPICS.map(t=>t.id));
function staticGen(list){return()=>{const it=list[Math.floor(Math.random()*list.length)];
  if(Array.isArray(it.options)){const right=it.options[it.correct];const opts=sh(it.options.slice());return {q:it.q,mc:opts,c:opts.indexOf(right),ex:it.ex||''};}
  return {q:it.q,a:+it.a,tol:it.tol!=null?+it.tol:0.001,unit:it.unit||'',ex:it.ex||''};};}
function validatePack(p){const bad=m=>{throw new Error(m);};
  if(!p||p.format!=='abi-trainer-pack'||(+p.schema||0)<1)bad('Das ist kein Fragenpaket.');
  if(!/^[a-z][a-z0-9_-]{1,30}$/.test(p.id||''))bad('Paket-ID fehlt oder ist ungültig.');
  if(!Array.isArray(p.topics)||!p.topics.length||p.topics.length>100)bad('Keine Themen im Paket.');
  const ids=new Set();
  p.topics.forEach(t=>{if(!/^[a-z][a-z0-9_]{1,24}$/.test(t.id||''))bad('Themen-ID ungültig: '+t.id);
    if(CORE_IDS.has(t.id))bad('Themen-ID gehört zur App: '+t.id);if(ids.has(t.id))bad('Themen-ID doppelt: '+t.id);ids.add(t.id);
    if(t.s!=='M'&&t.s!=='P')bad('Fach muss M oder P sein: '+t.id);if(!t.n||!t.d)bad('Name oder Beschreibung fehlt: '+t.id);
    if(!Array.isArray(t.cards)||t.cards.some(c=>!Array.isArray(c)||c.length<2))bad('Karten ungültig: '+t.id);
    if(!Array.isArray(t.questions)||!t.questions.length||t.questions.length>2000)bad('Fragen fehlen: '+t.id);
    t.questions.forEach(q=>{if(!q.q)bad('Frage ohne Text: '+t.id);
      if(Array.isArray(q.options)){if(q.options.length<2||q.options.length>6||!(q.correct>=0&&q.correct<q.options.length))bad('Auswahlfrage ungültig: '+t.id);}
      else if(!Number.isFinite(+q.a))bad('Antwort ist keine Zahl: '+t.id);});});
  return p;}
function unregisterPack(id){const p=ABI.packs.find(x=>x.id===id);if(!p)return;
  p.topics.forEach(t=>{const i=TOPICS.findIndex(x=>x.id===t.id);if(i>=0)TOPICS.splice(i,1);delete TOP[t.id];delete GL[t.id];delete GEN[t.id];});
  ABI.packs=ABI.packs.filter(x=>x.id!==id);}
function registerPack(p){validatePack(p);unregisterPack(p.id);
  p.topics.forEach(t=>{const top={id:t.id,s:t.s,n:safeHtml(t.n),d:safeHtml(t.d),vq:t.vq||t.n,pack:p.id,
      cards:t.cards.map(c=>[safeHtml(c[0]),safeHtml(c[1]),c[2]?safeHtml(c[2]):'']),};
    const qs=t.questions.map(q=>({...q,q:safeHtml(q.q),ex:safeHtml(q.ex||''),options:Array.isArray(q.options)?q.options.map(safeHtml):undefined}));
    TOPICS.push(top);TOP[t.id]=top;GL[t.id]=String(t.g||t.n[0]).slice(0,4);GEN[t.id]=staticGen(qs);});
  ABI.packs.push(p);}

     <div class="row2">${checkedM?`<button class="btn ghost" data-act="check" data-id="M">Mathe (${checkedM})</button>`:''}${checkedP?`<button class="btn ghost" data-act="check" data-id="P">Physik (${checkedP})</button>`:''}</div></div>`;}

/* ----- Ich ----- */
const SYNCTXT={ok:['ok','Gesichert. Dein Lernstand wird automatisch gespeichert und auf all deinen Geräten abgeglichen, auf denen du mit deinem Konto angemeldet bist.'],
  sync:['sync','Verbinde …'],

  ro:['err','Dein Konto darf hier nichts in der Cloud speichern. Bitte die Person, die den Link geteilt hat, dir die Stufe „Mitwirkender“ zu geben. Bis dahin bleibt der Lernstand auf diesem Gerät.'],
  err:['err','Die Cloud ist gerade nicht erreichbar. Dein Lernstand liegt sicher auf diesem Gerät und wird später erneut übertragen.']};

  const mx=Math.max(GOAL,...arr.map(a=>a.n));const wd=['So','Mo','Di','Mi','Do','Fr','Sa'];

  let h='<div class="stack">';
  h+=`<div class="hero"><div class="hero-l"><span class="hl">Level ${L.L}</span><h2>${S.n?esc(S.n):'Dein Profil'}</h2><p class="ttl">${esc(L.title)}</p><div class="xpbar"><i style="width:${Math.round(L.p*100)}%"></i></div><small>${S.x||0} XP insgesamt</small></div><div class="hero-r">${kobi('happy',84,true)}</div></div>`;
  h+=`<div class="card"><label class="eyebrow" for="nameIn">Wie soll Kobi dich nennen?</label><input class="name-in" id="nameIn" type="text" maxlength="24" autocomplete="off" value="${esc(S.n)}" placeholder="Dein Vorname"></div>`;
  h+=`<div class="nums"><div><b>${t0}</b><span>Antworten</span></div><div><b>${t0?Math.round(100*right/t0):0} %</b><span>richtig</span></div><div><b>${days}</b><span>aktive Tage</span></div><div><b>${nSafe()}/${TOPICS.length}</b><span>Themen sicher</span></div></div>`;
  h+=`<div class="card"><span class="eyebrow">Abzeichen (${Object.keys(S.b).length} von ${BADGES.length})</span><div class="badges">${BADGES.map(b=>{const on=S.b[b.id]!=null;return `<div class="bd ${on?'':'lock'}"><span class="g">${on?esc(b.g):'?'}</span><b>${esc(b.n)}</b><small>${esc(b.d)}</small></div>`;}).join('')}</div></div>`;
  h+=`<div class="card"><span class="eyebrow">Letzte 14 Tage (Antworten pro Tag)</span><div class="bars">${arr.map(a=>`<div><b class="${a.n?'':'zero'}" style="height:${a.n?Math.max(4,Math.round(a.n/mx*100)):3}%" title="${a.n}"></b><span>${wd[a.w]}</span></div>`).join('')}</div></div>`;
  ['M','P'].forEach(s=>{const items=TOPICS.filter(t=>t.s===s).sort((a,b)=>{const x=T(a.id).m,y=T(b.id).m;return (x==null?-1:x)-(y==null?-1:y);});
    h+=`<div class="card"><span class="eyebrow">${subjName(s)}: schwächste zuerst</span>${items.map(t=>{const st=status(T(t.id).m);return `<div class="res"><button class="link" style="text-align:left;color:var(--ink);text-decoration:none;padding:6px 0;min-height:36px" data-act="open" data-id="${t.id}">${esc(t.n)}</button><span class="chip st-${st}">${statusLabel[st]}</span></div>`;}).join('')}</div>`;});
  h+=STANDALONE?fileCards():cloudCards();
  h+=`<div class="card"><span class="eyebrow">Zurücksetzen</span>${ui.confirm?`<p class="small" style="margin-bottom:10px">${STANDALONE?'Wirklich alles löschen? Speichere vorher eine Datei, wenn du den Lernstand behalten willst. Das lässt sich nicht rückgängig machen.':'Wirklich alles löschen, auf diesem Gerät und in der Cloud? Das lässt sich nicht rückgängig machen. Auf anderen Geräten, auf denen die Seite gerade offen ist, bitte ebenfalls zurücksetzen.'}</p><div class="row2"><button class="btn sm no" data-act="reset2">Ja, alles löschen</button><button class="btn sm ghost" data-act="reset0">Abbrechen</button></div>`:`<button class="btn sm no" data-act="reset1">Lernstand löschen</button>`}</div>`;

/* ----- Eltern ----- */
function ago(d){if(d==null)return 'noch nie';const k=today()-d;return k<=0?'heute':k===1?'gestern':`vor ${k} Tagen`;}
function errItems(log,n){const w=log.filter(e=>!e.ok&&TOP[e.tp]).slice(-n).reverse();
  return w.length?w.map(e=>{const q=String(e.q||'');return `<div class="ref"><span class="chip">${esc(TOP[e.tp].n)}</span><div style="margin:6px 0 4px">${esc(q.length>170?q.slice(0,170)+'…':q)}</div>${e.k==='c'?'<span class="small muted">Karte nicht gewusst</span>':`${e.sk?'<span class="small muted">Übersprungen.</span><br>':`<span class="small">Antwort: <span class="strike">${esc(e.g==null?'':e.g)}</span></span><br>`}<span class="small">Richtig: <b>${esc(e.c||'')}</b></span>`}</div>`;}).join(''):'<p class="small muted">Noch keine falschen Antworten.</p>';}
function reportCard(r,nm,isMe,extra){
  const th=Object.entries(r.th||{}).map(([id,v])=>({id,m:v[0],n:v[1]})).filter(x=>TOP[x.id]).sort((a,b)=>a.m-b.m);
  const weak=th.filter(x=>x.m<75).slice(0,6),open=TOPICS.length-th.length;
  const days=[];for(let i=13;i>=0;i--)days.push((r.h&&r.h[today()-i])||0);const mx=Math.max(GOAL,...days);
  const active=r.last!=null&&today()-r.last<=1;
  return `<div class="card"><div class="row2" style="justify-content:space-between;flex-wrap:nowrap"><div style="min-width:0"><h2 style="overflow-wrap:anywhere">${esc(nm)}${isMe?' <span class="tag">du</span>':''}</h2><p class="small muted">Level ${r.lv||1}, ${esc(r.ti||'')}</p></div><span class="chip st-${active?'sicher':'schwach'}">Zuletzt aktiv: ${ago(r.last)}</span></div>
     <div class="nums" style="margin-top:14px"><div><b>${r.td||0}/${GOAL}</b><span>heute</span></div><div><b>${r.st||0}</b><span>Tage in Folge</span></div><div><b>${r.tot?Math.round(100*(r.ok||0)/r.tot):0} %</b><span>richtig (${r.tot||0} Antworten)</span></div><div><b>${r.safe||0}/${TOPICS.length}</b><span>Themen sicher</span></div></div>
     <span class="eyebrow" style="margin-top:16px">Letzte 14 Tage</span><div class="bars">${days.map((n,i)=>`<div><b class="${n?'':'zero'}" style="height:${n?Math.max(4,Math.round(n/mx*100)):3}%" title="${n}"></b><span>${['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(Date.now()-(13-i)*864e5).getDay()]}</span></div>`).join('')}</div>
     <span class="eyebrow" style="margin-top:16px">Hier hakt es noch</span>${weak.length?weak.map(x=>{const st=status(x.m);return `<div class="res"><span>${esc(TOP[x.id].n)}</span><span class="chip st-${st}">${statusLabel[st]}</span></div>`;}).join(''):'<p class="small muted">Keine schwachen Themen unter den geprüften.</p>'}
     ${open>0?`<p class="small muted" style="margin-top:8px">${open} Themen noch nicht geprüft.</p>`:''}${extra||''}</div>`;}
function viewParent(){
  const rs=ui.reports;let h='<div class="stack">';
  h+=`<div class="card"><span class="eyebrow">Für Eltern</span><h2>Lernfortschritt</h2><p class="small muted" style="margin-top:6px">Hier siehst du, wie jede Person übt, die diese Seite mit eigenem Konto nutzt. Die Antworten im Einzelnen bleiben privat, du siehst nur die Zusammenfassung.</p></div>`;
  if(rs===null)return h+'<div class="card"><p class="muted">Lade …</p></div></div>';
  if(!rs.length){
    h+=`<div class="card"><h3>Noch nichts zu sehen</h3><p class="small muted" style="margin:6px 0 12px">${ui.repErr?'Die Übersicht konnte nicht geladen werden. Bitte später erneut öffnen.':'Sobald deine Tochter die Seite mit ihrem eigenen Konto öffnet und die erste Aufgabe löst, erscheint ihr Fortschritt hier.'}</p></div>`;}
  rs.slice().sort((a,b)=>(b.u||0)-(a.u||0)).forEach(r=>{const p=ui.names&&ui.names[r.id];h+=reportCard(r,(p&&p.name)||r.n||'Ohne Namen',!!(p&&p.isMe));});
  return h+'</div>';}

  h+=`<div class="card"><span class="eyebrow">Fragenpakete</span><p class="small muted" style="margin-bottom:8px">Neue Themen und Fragen kommen als Paket-Datei (.json) dazu. Dein Lernstand bleibt dabei erhalten.</p>
   ${ABI.packs.length?ABI.packs.map(p=>`<div class="res"><span>${esc(p.name||p.id)} <span class="muted small">(${p.topics.length} Themen, Version ${esc(p.version||'?')})</span></span><button class="btn sm no" data-act="packdel" data-id="${esc(p.id)}">Entfernen</button></div>`).join(''):'<p class="small muted">Noch kein Paket geladen.</p>'}

   <div class="card"><div class="row2" style="justify-content:space-between"><span class="chip st-${st}">${statusLabel[st]}</span><span class="small muted">${s.n?`${s.n} beantwortet, ${Math.round(100*s.r/s.n)} % richtig`:'noch nicht geprüft'}</span></div>
    <div class="row2" style="margin-top:14px"><button class="btn" data-act="practice" data-id="${id}">5 Aufgaben üben</button><button class="btn ghost" data-act="cards" data-id="${id}">Karten abfragen</button></div></div>
   <div class="card"><span class="eyebrow">Das Wichtigste</span>${t.cards.map(c=>`<div class="ref"><b>${c[0]}</b>${c[1]}${c[2]?`<div class="tip">${c[2]}</div>`:''}</div>`).join('')}</div>
   <div class="card"><span class="eyebrow">Erklärvideos</span>${vlinks(t)}</div>
  </div></div>`;}

/* ----- Übungs-Sitzung ----- */
function sessHtml(){const s=sess;if(s.i>=s.items.length)return sumHtml();
  const it=s.items[s.i],t=TOP[it.tid];const pct=Math.round(s.i/s.items.length*100);
  if(!s.t0)s.t0=Date.now();
  if(!s.cur&&it.k==='q')s.cur=genQ(it.tid);
  let h=`<div class="ov"><div class="wrap">
   <div class="stop"><button class="x" data-act="quit" aria-label="Sitzung beenden">✕</button><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${s.combo>=2?`<span class="combo" aria-label="Kombo ${s.combo}">${FLAME}×${s.combo}</span>`:''}<span class="cnt">${s.i+1}/${s.items.length}</span></div>
   <div class="tagrow"><span class="tag s${t.s}">${subjName(t.s)}</span><span class="tn">${esc(t.n)}</span><span class="kind">${it.k==='c'?'Wissenskarte':s.mode}</span></div>`;
  if(it.k==='c'){const c=t.cards[it.ci];
    h+=`<div class="qcard s${t.s} pop"><span class="qlab">Frage</span>${c[0]}</div>`;
    if(!s.rev)h+=`<div style="margin-top:16px"><button class="btn wide" data-act="reveal">Antwort zeigen</button><p class="small muted" style="margin-top:8px;text-align:center">Erst überlegen, dann aufdecken.</p></div>`;
    else h+=`<div class="qcard card-a s${t.s} pop" style="margin-top:14px"><span class="qlab">Antwort</span>${c[1]}${c[2]?`<div class="tip">${c[2]}</div>`:''}</div><div class="row2" style="margin-top:16px;flex-wrap:nowrap"><button class="btn no wide" data-act="dunno">Nicht gewusst</button><button class="btn wide" data-act="know">Gewusst</button></div>`;
  }else{const q=s.cur;
    h+=`<div class="qcard s${t.s}${s.phase==='ask'?' pop':''}">${q.q}</div>`;
    if(s.phase==='ask'){
      if(q.mc)h+=`<div class="opts">${q.mc.map((o,i)=>`<button class="opt" data-act="mc" data-id="${i}"><b>${'ABCD'[i]}</b><span>${o}</span></button>`).join('')}</div>`;
      else h+=`<form id="af" autocomplete="off"><div class="answer-row"><input class="in" id="ans" type="text" inputmode="text" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort" placeholder="Antwort">${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}</div>
        <div class="keys" aria-label="Eingabehilfe"><button type="button" data-act="ins" data-id="−" aria-label="Minus">−</button><button type="button" data-act="ins" data-id="," aria-label="Komma">,</button><button type="button" data-act="ins" data-id="/" aria-label="Bruchstrich">/</button></div>
        <div class="err" id="err" role="alert"></div><button class="btn wide" type="submit">Prüfen</button></form>`;
      h+=`<div style="text-align:center;margin-top:6px"><button class="link" data-act="skip">Weiß ich nicht</button></div>`;
    }else{
      const L=s.last,skipped=L.given==null;
      if(q.mc)h+=`<div class="opts">${q.mc.map((o,i)=>`<button class="opt ${i===q.c?'right':(i===L.given?'wrong':'')}" disabled><b>${'ABCD'[i]}</b><span>${o}</span></button>`).join('')}</div>`;
      const praise=['Richtig!','Stark!','Genau so!','Sauber gerechnet!'][s.results.length%4];
      h+=`<div class="fb ${L.ok?'ok':'no'} pop" role="status"><div class="fbh">${kobi(L.ok?(s.combo>=3?'cheer':'happy'):'oops',56)}<div><b class="h">${L.ok?praise:skipped?'Das üben wir.':'Fast. Schau mal:'}</b><span class="xp">+${L.gain||0} XP</span>${L.ok&&s.combo>=3?` <span class="xp" style="background:var(--soft);color:var(--ink)">Kombo ×${s.combo}</span>`:''}</div></div>`;
      if(!q.mc){
        if(!L.ok&&!skipped)h+=`Deine Antwort: <span class="strike">${esc(L.given)}</span><br>`;
        h+=`${L.ok?'Lösung':'Richtig wäre'}: <span class="mk">${showNum(q.a)}${q.unit?' '+esc(q.unit):''}</span>`;}
      if(q.ex)h+=`<div class="ex">${q.ex}</div>`;
      h+=`</div><button class="btn wide" style="margin-top:16px" data-act="next">${s.i+1>=s.items.length?'Ergebnis ansehen':'Weiter'}</button>`;
    }}
  return h+'</div></div>';}
function sumHtml(){const s=sess;const ok=s.results.filter(r=>r.ok).length,n=s.results.length;
  const by={};s.results.forEach(r=>{(by[r.tid]=by[r.tid]||{ok:0,n:0}).n++;if(r.ok)by[r.tid].ok++;});
  const miss=Object.keys(by).filter(k=>by[k].ok<by[k].n);
  const td=S.h[today()]||{n:0};const L=lvInfo(S.x||0);
  const good=n>0&&ok/n>=0.6;
  const msg=n===0?'':ok===n?'Alles richtig. Stark!':good?'Gutes Ergebnis. Die roten Themen kommen bald wieder.':'Genau dafür ist das hier da: Die roten Themen kommen jetzt öfter dran.';
  return `<div class="ov"><div class="wrap stack"><div class="stop"><button class="x" data-act="quit" aria-label="Schließen">✕</button><span class="tag">${esc(s.mode)}</span></div>
   <div class="card sumtop">${kobi(n===0?'sleep':ok===n||good?'cheer':'happy',110,true)}<div class="big">${ok} von ${n}</div><p>${msg}</p><span class="xp" style="font-size:1.05rem;padding:7px 14px">+${s.xp} XP</span>
    <div style="width:100%;margin-top:10px"><div class="bar g"><i style="width:${Math.round(L.p*100)}%"></i></div><p class="small muted" style="margin-top:6px">Level ${L.L}, ${esc(L.title)}${s.lvl?' (neu!)':''}</p></div>
    ${td.n>=GOAL?'<p class="small" style="color:var(--ok);font-weight:800">Tagesziel erreicht.</p>':`<p class="small muted">Heute insgesamt ${td.n} von ${GOAL}.</p>`}</div>
   ${s.newB.length?`<div class="card"><span class="eyebrow">Neue Abzeichen</span><div class="badges">${s.newB.map(id=>{const b=BADGES.find(x=>x.id===id);return `<div class="bd"><span class="g">${esc(b.g)}</span><b>${esc(b.n)}</b><small>${esc(b.d)}</small></div>`;}).join('')}</div></div>`:''}
   <div class="card"><span class="eyebrow">Nach Themen</span>${Object.keys(by).map(k=>`<div class="res"><span>${esc(TOP[k].n)}</span><span class="chip st-${by[k].ok===by[k].n?'sicher':'schwach'}">${by[k].ok}/${by[k].n}</span></div>`).join('')||'<p class="muted small">Keine Antworten.</p>'}</div>
   ${miss.length?`<div class="card"><span class="eyebrow">Nochmal ansehen</span><div class="grid">${miss.map(k=>tile(TOP[k])).join('')}</div></div>`:''}
   <div class="row2">${s.mode==='Üben'?`<button class="btn" data-act="again">Noch 5 Aufgaben</button>`:''}<button class="btn ${s.mode==='Üben'?'ghost':'wide'}" data-act="quit">Fertig</button></div></div></div>`;}

/* ----- Rendern ----- */
function view(){const t=ABI.tabs.find(t=>t.id===ui.tab&&(!t.show||t.show()))||ABI.tabs[0];return t.view();}
function renderAll(){$('#main').innerHTML=header()+view();$('#nav').innerHTML=navHtml();renderOv();}
function renderOv(){const ov=$('#ov');
  ov.innerHTML=sess?sessHtml():ui.topic?topicHtml(ui.topic):'';
  document.documentElement.classList.toggle('lock',!!(sess||ui.topic));
  const a=$('#ans');if(a)a.focus({preventScroll:true});}

/* ----- Aktionen ----- */
function grade(ok,given){const s=sess,it=s.items[s.i],q=s.cur;s.phase='fb';s.last={ok,given};record(it.tid,ok,0.3);s.results.push({tid:it.tid,ok});
  logAns({k:'q',tp:it.tid,q:plain(q.q),g:given==null?null:q.mc?plain(q.mc[given]):String(given),c:q.mc?plain(q.mc[q.c]):showNum(q.a)+(q.unit?' '+q.unit:''),ok:ok?1:0,sk:given==null?1:0,ms:elapsed()});
  afterAnswer(ok,'q');if(ok)burst(18);renderOv();}
function checkNum(){const q=sess.cur,inp=$('#ans');const vals=parseNums(inp.value);
  if(!vals.length){$('#err').textContent='Bitte eine Zahl eingeben, zum Beispiel 12,5 oder 3/4.';inp.focus();return;}
  grade(vals.some(v=>Math.abs(v-q.a)<=q.tol),inp.value.trim());}
function next(){const s=sess;s.i++;s.t0=0;s.cur=null;s.phase='ask';s.rev=false;s.last=null;
  if(s.i>=s.items.length){checkBadges();save();ABI.emit('session',{mode:s.mode,results:s.results,xp:s.xp});if(s.results.length&&s.results.filter(r=>r.ok).length/s.results.length>=0.6)burst(36);}
  renderOv();}
function act(a,d){
  if(ABI.actions[a]){ABI.actions[a](d);return;}
  switch(a){
    case 'tab':ui.tab=d.id;ui.msg='';ui.confirm=false;renderAll();window.scrollTo(0,0);break;
    case 'filter':ui.filter=d.id;renderAll();break;
    case 'open':ui.topic=d.id;renderOv();break;
    case 'close':ui.topic=null;renderAll();break;
    case 'daily':startDaily();break;
    case 'check':startCheck(d.id);break;
    case 'hunt':startHunt();break;
    case 'practice':startPractice(d.id);break;
    case 'cards':startCards(d.id);break;
    case 'again':startPractice(sess.items[0].tid);break;
    case 'quit':sess=null;renderAll();break;
    case 'reveal':sess.rev=true;renderOv();break;
    case 'know':case 'dunno':{const it=sess.items[sess.i];const ok=a==='know';sess.last={ok,given:null};cardResult(it.tid,it.ci,ok);sess.results.push({tid:it.tid,ok});logAns({k:'c',tp:it.tid,ci:it.ci,q:plain(TOP[it.tid].cards[it.ci][0]),ok:ok?1:0,ms:elapsed()});afterAnswer(ok,'c');sess.last=null;next();break;}
    case 'mc':grade(+d.id===sess.cur.c,+d.id);break;
    case 'skip':grade(false,null);break;
    case 'next':next();break;
    case 'ins':{const i=$('#ans');if(i){const p=i.selectionStart==null?i.value.length:i.selectionStart;i.value=i.value.slice(0,p)+d.id+i.value.slice(i.selectionEnd==null?p:i.selectionEnd);i.focus();const np=p+d.id.length;try{i.setSelectionRange(np,np);}catch(e){}}break;}
    case 'exp':ui.code=JSON.stringify(toFile());ui.msg='';renderAll();break;
    case 'dl':{const n='abi-trainer-fortschritt-'+dstr()+'.json';if(saveFile(n,JSON.stringify(toFile(),null,1),'application/json')){S.lx=today();save();ui.msg='Gespeichert als '+n+'. Schau in deinen Downloads oder in der Dateien-App.';}else ui.msg='Speichern wurde blockiert. Nutze unten „als Text“.';renderAll();break;}
    case 'csv':{const n='abi-trainer-antworten-'+dstr()+'.csv';ui.msg=saveFile(n,csvFile(),'text/csv')?'Tabelle gespeichert als '+n+'.':'Speichern wurde blockiert.';renderAll();break;}
    case 'errs':{const ids=[...new Set(S.log.filter(e=>!e.ok&&TOP[e.tp]).slice(-30).reverse().map(e=>e.tp))].slice(0,3);if(!ids.length)break;startSess('Fehler-Heft',Array.from({length:6},(_, i)=>({k:'q',tid:ids[i%ids.length]})));break;}
    case 'copy':{const ta=$('#codeOut'),m=$('#msg');const say=t=>{ui.msg=t;if(m)m.textContent=t;};
      const fallback=()=>{if(ta){ta.focus();ta.select();}say('Code markiert. Jetzt kopieren (Strg+C oder lange tippen).');};
      try{navigator.clipboard.writeText(ui.code).then(()=>say('Code kopiert.'),fallback);}catch(e){fallback();}break;}
    case 'imp':handleFile(($('#codeIn').value||'').trim(),'fileIn');break;
    case 'pwshow':{const p=$('#pw');if(p)p.type=p.type==='password'?'text':'password';break;}
    case 'logout':logout();break;
    case 'packdel':unregisterPack(d.id);savePacks();ui.packMsg='Paket entfernt. Dein bisheriger Lernstand zu diesen Themen bleibt gespeichert.';renderAll();break;
    case 'reset1':ui.confirm=true;renderAll();break;
    case 'reset0':ui.confirm=false;renderAll();break;
    case 'reset2':S=blank();S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      cloud.lastRep='';cloudSchedule();
      ui.confirm=false;ui.code='';ui.msg='';renderAll();break;
  }}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b.dataset);});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='af'&&sess)checkNum();if(e.target.id==='gf')tryUnlock();});
document.addEventListener('change',e=>{const el=e.target;if(!el)return;
  if(el.id==='nameIn'){S.n=el.value.trim().slice(0,24);save();renderAll();}
  if(el.id==='packIn'){const f=el.files&&el.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const p=JSON.parse(String(rd.result));ABI.registerPack(p);ui.packMsg=`Paket „${p.name||p.id}“ geladen: ${p.topics.length} Themen.`;}catch(err){ui.packMsg='Paket nicht geladen: '+(err&&err.message?err.message:'ungültige Datei')+'.';}renderAll();};
    rd.onerror=()=>{ui.packMsg='Die Datei konnte nicht gelesen werden.';renderAll();};rd.readAsText(f);el.value='';return;}
  if(el.id==='fileIn'||el.id==='viewIn'){const f=el.files&&el.files[0];if(!f)return;const mode=el.id;const rd=new FileReader();
    rd.onload=()=>handleFile(String(rd.result),mode);rd.onerror=()=>{ui.msg='Die Datei konnte nicht gelesen werden.';renderAll();};rd.readAsText(f);el.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&sess&&sess.phase==='fb'&&sess.items[sess.i]&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();next();}
  if(e.key==='Escape'){if(sess){sess=null;renderAll();}else if(ui.topic){ui.topic=null;renderAll();}}});
ABI.registerTab({id:'home',label:'Heute',icon:ICON.home,view:viewHome,order:10});
ABI.registerTab({id:'topics',label:'Themen',icon:ICON.topics,view:viewTopics,order:20});
ABI.registerTab({id:'videos',label:'Videos',icon:ICON.videos,view:viewVideos,order:30});
ABI.registerTab({id:'me',label:'Ich',icon:ICON.me,view:viewMe,order:40});
ABI.registerTab({id:'parent',label:'Eltern',icon:ICON.parent,view:viewParent,order:45,show:()=>ui.parent});
loadPacks();
let booted=false;
function boot(){renderAll();if(!booted){booted=true;initCloud();ABI.emit('boot');}}
if(AUTH&&!authOk())showGate();else boot();

</script></body></html>
